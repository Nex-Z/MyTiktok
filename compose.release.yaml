services:
  mytiktok:
    image: ${IMAGE:-mytiktok:latest}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-18081}:8080"
    environment:
      TZ: Asia/Hong_Kong
      MEDIA_ROOT: /media
    volumes:
      - ./data:/data
      - ${MEDIA_PATH:-./media}:/media:ro
    stop_grace_period: 30s


services:
  mytiktok:
    image: ${IMAGE:-mytiktok:latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/mytiktok", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-18081}:8080"
    environment:
      TZ: Asia/Hong_Kong
      MEDIA_ROOT: /media
    volumes:
      - ./data:/data
      - ${MEDIA_PATH:-./media}:/media:rw
    stop_grace_period: 30s


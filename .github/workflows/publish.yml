name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --draft
  image:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: mytiktok:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          gzip -1 /tmp/image.tar
          mv /tmp/image.tar.gz "mytiktok-linux-$ARCH.tar.gz"
          sha256sum "mytiktok-linux-$ARCH.tar.gz" > "mytiktok-linux-$ARCH.tar.gz.sha256"
          gh release upload "$GITHUB_REF_NAME" "mytiktok-linux-$ARCH.tar.gz" "mytiktok-linux-$ARCH.tar.gz.sha256" --clobber
  publish:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" compose.release.yaml update.sh --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
